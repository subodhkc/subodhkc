name: Daily AI Article Generation

on:
  schedule:
    # Every day at 14:00 UTC (09:00 CST) - optimal LinkedIn posting time
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific topic (leave empty for auto-pick from content calendar)'
        required: false
        type: string
      review_only:
        description: 'Generate for manual review only (do not auto-publish)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  generate-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ran: ${{ steps.check.outputs.ran }}
      review_only: ${{ steps.check.outputs.review_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate article from content calendar
        id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret not set"
            exit 1
          fi

          TOPIC="${{ github.event.inputs.topic }}"
          REVIEW_ONLY="${{ github.event.inputs.review_only }}"
          EXTRA_ARGS=""
          if [ "$REVIEW_ONLY" = "true" ]; then
            EXTRA_ARGS="--review-only"
          fi
          if [ -n "$TOPIC" ]; then
            echo "Generating article with custom topic: $TOPIC"
            node scripts/generate-article.mjs --topic="$TOPIC" $EXTRA_ARGS
          else
            echo "Generating article from content calendar..."
            node scripts/generate-article.mjs $EXTRA_ARGS
          fi
          echo "ran=true" >> $GITHUB_OUTPUT
          if [ "$REVIEW_ONLY" = "true" ]; then
            echo "review_only=true" >> $GITHUB_OUTPUT
          else
            echo "review_only=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate social content for all articles
        if: success() && steps.check.outputs.ran == 'true' && steps.check.outputs.review_only != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f data/blog/daily-manifest.json ]; then
            SLUGS=$(node -e "const m=require('./data/blog/daily-manifest.json'); (m.articles||[]).forEach(a=>console.log(a.slug))")
            for SLUG in $SLUGS; do
              echo "Generating social content for: $SLUG"
              node scripts/generate-social.mjs --slug="$SLUG" --force --no-review || echo "::warning::Social generation failed for $SLUG"
            done
          elif [ -n "$(ls data/blog/posts/*.json 2>/dev/null)" ]; then
            LATEST=$(ls -t data/blog/posts/*.json | head -1)
            SLUG=$(basename "$LATEST" .json)
            echo "No manifest found, generating social content for latest: $SLUG"
            node scripts/generate-social.mjs --slug="$SLUG" --force --no-review
          fi

      - name: Upload article artifact
        if: always() && steps.check.outputs.ran == 'true' && steps.check.outputs.review_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: article
          path: |
            data/blog/posts/
            data/blog/daily-manifest.json
            data/social/
            public/blog-images/
            public/downloads/
          retention-days: 1

  commit-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [generate-article]
    if: ${{ !cancelled() && needs.generate-article.outputs.review_only != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download article artifact
        if: needs.generate-article.result == 'success' && needs.generate-article.outputs.ran == 'true'
        uses: actions/download-artifact@v4
        with:
          name: article
          path: .

      - name: Commit and push article to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain data/blog/posts/ data/blog/daily-manifest.json data/social/ public/blog-images/ public/downloads/)" ]; then
            git add data/blog/posts/ data/blog/daily-manifest.json data/social/ public/blog-images/ public/downloads/
            git commit -m "feat: daily AI articles + social content + hero images"

            # Push with retry logic (up to 3 attempts)
            MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              git pull --rebase origin main
              if git push; then
                echo "Article auto-merged to main (attempt $attempt)"
                break
              else
                echo "Push attempt $attempt failed, retrying..."
                if [ $attempt -eq $MAX_RETRIES ]; then
                  echo "::error::Failed to push after $MAX_RETRIES attempts"
                  exit 1
                fi
                sleep 10
              fi
            done
          else
            echo "No changes - article generation may have failed"
            exit 1
          fi

  post-to-linkedin:
    runs-on: ubuntu-latest
    needs: [commit-and-push, generate-article]
    if: needs.commit-and-push.result == 'success' && needs.generate-article.outputs.review_only != 'true'
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_MEMBER_ID: ${{ secrets.LINKEDIN_MEMBER_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download article artifact
        if: needs.generate-article.result == 'success' && needs.generate-article.outputs.ran == 'true'
        uses: actions/download-artifact@v4
        with:
          name: article
          path: .

      - name: Wait for Vercel deployment
        run: |
          echo "Waiting 90 seconds for Vercel deployment to complete..."
          sleep 90

          # Check authority article from manifest, fall back to latest
          SLUG=""
          if [ -f data/blog/daily-manifest.json ]; then
            SLUG=$(node -e "const m=require('./data/blog/daily-manifest.json'); const a=(m.articles||[]).find(x=>x.type==='authority'); if(a) console.log(a.slug)" 2>/dev/null)
          fi
          if [ -z "$SLUG" ] && [ -n "$(ls data/blog/posts/*.json 2>/dev/null)" ]; then
            LATEST=$(ls -t data/blog/posts/*.json | head -1)
            SLUG=$(basename "$LATEST" .json)
          fi

          if [ -n "$SLUG" ]; then
            ARTICLE_URL="https://subodhkc.com/blog/${SLUG}"
            echo "Checking availability of: $ARTICLE_URL"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ARTICLE_URL" || echo "000")
            echo "HTTP response: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::Article URL not yet available ($HTTP_CODE). Social posting will proceed but may link to a not-yet-deployed page."
            else
              echo "Article URL is live."
            fi
          fi

      - name: Post authority article to LinkedIn
        run: |
          if [ -z "$LINKEDIN_ACCESS_TOKEN" ] || [ -z "$LINKEDIN_MEMBER_ID" ]; then
            echo "::warning::LINKEDIN_ACCESS_TOKEN or LINKEDIN_MEMBER_ID not set - skipping LinkedIn post"
            exit 0
          fi

          # Find the authority article from manifest, fall back to latest
          SLUG=""
          if [ -f data/blog/daily-manifest.json ]; then
            SLUG=$(node -e "const m=require('./data/blog/daily-manifest.json'); const a=(m.articles||[]).find(x=>x.type==='authority'); if(a) console.log(a.slug)")
          fi
          if [ -z "$SLUG" ] && [ -n "$(ls data/blog/posts/*.json 2>/dev/null)" ]; then
            LATEST=$(ls -t data/blog/posts/*.json | head -1)
            SLUG=$(basename "$LATEST" .json)
          fi

          if [ -n "$SLUG" ]; then
            echo "Posting to LinkedIn: $SLUG"
            node scripts/post-linkedin.mjs --slug="$SLUG" || echo "::warning::LinkedIn post failed for $SLUG"
          else
            echo "::warning::No blog posts found - skipping LinkedIn post"
          fi

      - name: Commit posted tracker
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "data/social/posted.json" ]; then
            git add data/social/posted.json
            git commit -m "chore: update LinkedIn posted tracker" || echo "No changes to tracker"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then break; fi
              if [ $attempt -eq 3 ]; then echo "Push failed - tracker will be regenerated next run"; else sleep 5; fi
            done
          fi

      - name: Cross-post authority article to Dev.to
        if: success()
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "::notice::DEVTO_API_KEY not set - skipping Dev.to cross-post"
            exit 0
          fi

          # Find the authority article from manifest, fall back to latest
          SLUG=""
          if [ -f data/blog/daily-manifest.json ]; then
            SLUG=$(node -e "const m=require('./data/blog/daily-manifest.json'); const a=(m.articles||[]).find(x=>x.type==='authority'); if(a) console.log(a.slug)")
          fi
          if [ -z "$SLUG" ] && [ -n "$(ls data/blog/posts/*.json 2>/dev/null)" ]; then
            LATEST=$(ls -t data/blog/posts/*.json | head -1)
            SLUG=$(basename "$LATEST" .json)
          fi

          if [ -n "$SLUG" ]; then
            echo "Cross-posting to Dev.to: $SLUG"
            node scripts/cross-post-devto.mjs --slug="$SLUG" || echo "::warning::Dev.to cross-post failed for $SLUG"
          else
            echo "::warning::No blog posts found - skipping Dev.to cross-post"
          fi

      - name: Notify Google Indexing API + IndexNow
        if: success()
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          # Collect all article URLs from manifest, fall back to latest
          URL_LIST=""
          if [ -f data/blog/daily-manifest.json ]; then
            URL_LIST=$(node -e "const m=require('./data/blog/daily-manifest.json'); console.log((m.articles||[]).map(a=>'https://subodhkc.com/blog/'+a.slug).join(' '))")
          elif [ -n "$(ls data/blog/posts/*.json 2>/dev/null)" ]; then
            LATEST=$(ls -t data/blog/posts/*.json | head -1)
            SLUG=$(basename "$LATEST" .json)
            URL_LIST="https://subodhkc.com/blog/${SLUG}"
          fi

          if [ -z "$URL_LIST" ]; then
            echo "::warning::No blog posts found - skipping indexing notification"
            exit 0
          fi

          echo "Notifying search engines about articles: $URL_LIST"

          # Build JSON array of URLs for IndexNow
          URL_JSON=$(node -e "const urls='$URL_LIST'.split(' '); console.log(JSON.stringify(urls))")

          # 1. Ping IndexNow (Bing, Yandex, Seznam) - all URLs at once
          INDEXNOW_RESP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\": \"subodhkc.com\", \"key\": \"subodhkcindexnowkey2026\", \"keyLocation\": \"https://subodhkc.com/subodhkcindexnowkey2026.txt\", \"urlList\": $URL_JSON}")
          echo "IndexNow response: $INDEXNOW_RESP"

          # 2. Submit to Google Indexing API (if credentials available)
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::GCP_SERVICE_ACCOUNT_JSON not set - skipping Google Indexing API"
            exit 0
          fi

          pip install cryptography -q

          ACCESS_TOKEN=$(python3 -c "
          import json, urllib.request, urllib.parse, base64, time
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          key = json.loads('''$GCP_SERVICE_ACCOUNT_JSON''')
          header = {'alg': 'RS256', 'typ': 'JWT'}
          payload = {
              'iss': key['client_email'],
              'scope': 'https://www.googleapis.com/auth/indexing',
              'aud': 'https://oauth2.googleapis.com/token',
              'exp': int(time.time()) + 3600,
              'iat': int(time.time())
          }
          def b64encode(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()
          header_b64 = b64encode(json.dumps(header, separators=(',', ':')).encode())
          payload_b64 = b64encode(json.dumps(payload, separators=(',', ':')).encode())
          private_key = serialization.load_pem_private_key(key['private_key'].encode(), password=None)
          signature = private_key.sign(f'{header_b64}.{payload_b64}'.encode(), padding.PKCS1v15(), hashes.SHA256())
          jwt = f'{header_b64}.{payload_b64}.{b64encode(signature)}'
          data = urllib.parse.urlencode({'grant_type': 'urn:ietf:params:oauth:grant-type:jwt-bearer', 'assertion': jwt}).encode()
          req = urllib.request.Request('https://oauth2.googleapis.com/token', data=data)
          resp = urllib.request.urlopen(req)
          print(json.loads(resp.read())['access_token'])
          ")

          if [ -n "$ACCESS_TOKEN" ]; then
            for ARTICLE_URL in $URL_LIST; do
              GGL_RESP=$(curl -s -w "\n%{http_code}" \
                -X POST "https://indexing.googleapis.com/v3/urlNotifications:publish" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -d "{\"url\": \"$ARTICLE_URL\", \"type\": \"URL_UPDATED\"}")
              GGL_CODE=$(echo "$GGL_RESP" | tail -1)
              echo "Google Indexing API response for $ARTICLE_URL: $GGL_CODE"
              if [ "$GGL_CODE" != "200" ]; then
                echo "::error::Google Indexing API failed with HTTP $GGL_CODE for $ARTICLE_URL"
                if [ "$GGL_CODE" = "403" ]; then
                  echo "::error::403 Permission denied. Add service account as Owner in Google Search Console > Settings > Users and permissions."
                fi
              fi
            done
            exit 0
          else
            echo "::error::Could not get Google access token"
            exit 0
          fi

      - name: Send Medium import reminder
        if: success()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY not set - skipping Medium reminder"
            exit 0
          fi

          # Send reminder for all articles from manifest, fall back to latest
          if [ -f data/blog/daily-manifest.json ]; then
            SLUGS=$(node -e "const m=require('./data/blog/daily-manifest.json'); (m.articles||[]).forEach(a=>console.log(a.slug))")
            for SLUG in $SLUGS; do
              echo "Sending Medium import reminder for: $SLUG"
              node scripts/cross-post-medium.mjs --slug="$SLUG" || echo "::warning::Medium reminder failed for $SLUG"
            done
          elif [ -n "$(ls data/blog/posts/*.json 2>/dev/null)" ]; then
            LATEST=$(ls -t data/blog/posts/*.json | head -1)
            SLUG=$(basename "$LATEST" .json)
            echo "Sending Medium import reminder for: $SLUG"
            node scripts/cross-post-medium.mjs --slug="$SLUG" || echo "::warning::Medium reminder failed for $SLUG"
          else
            echo "::warning::No blog posts found - skipping Medium reminder"
          fi

      - name: Generate outreach plan
        if: success()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Generate outreach for authority article from manifest, fall back to latest
          SLUG=""
          if [ -f data/blog/daily-manifest.json ]; then
            SLUG=$(node -e "const m=require('./data/blog/daily-manifest.json'); const a=(m.articles||[]).find(x=>x.type==='authority'); if(a) console.log(a.slug)")
          fi
          if [ -z "$SLUG" ] && [ -n "$(ls data/blog/posts/*.json 2>/dev/null)" ]; then
            LATEST=$(ls -t data/blog/posts/*.json | head -1)
            SLUG=$(basename "$LATEST" .json)
          fi

          if [ -n "$SLUG" ]; then
            echo "Generating outreach plan for: $SLUG"
            node scripts/outreach-generator.mjs --slug="$SLUG" --log-supabase || echo "::warning::Outreach generation failed for $SLUG"
          else
            echo "::warning::No blog posts found - skipping outreach plan"
          fi

      - name: Commit cross-post trackers and outreach plans
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog/devto-posted.json data/blog/medium-posted.json data/outreach/ 2>/dev/null || true
          git commit -m "chore: update cross-post trackers and outreach plans" || echo "No changes to commit"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ $attempt -eq 3 ]; then echo "Push failed - will retry next run"; else sleep 5; fi
          done

      - name: Generate summary report
        if: always()
        run: |
          echo "## Daily Article Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f data/blog/daily-manifest.json ]; then
            echo "| # | Type | Title | URL | Words | Social | Image |" >> $GITHUB_STEP_SUMMARY
            echo "|---|------|-------|-----|-------|--------|-------|" >> $GITHUB_STEP_SUMMARY
            node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('data/blog/daily-manifest.json','utf-8'));(m.articles||[]).forEach((a,i)=>{const u='https://subodhkc.com/blog/'+a.slug;const s=fs.existsSync('data/social/'+a.slug+'.md')?'Yes':'No';const img=fs.existsSync('public/blog-images/'+a.slug+'.png')?'Yes':'No';console.log('| '+(i+1)+' | '+a.type+' | '+a.title.substring(0,40)+'... | ['+a.slug+']('+u+') | '+a.wordCount+' | '+s+' | '+img+' |');});" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| LinkedIn | $([ -f data/social/posted.json ] && echo 'Posted' || echo 'Skipped/Failed') |" >> $GITHUB_STEP_SUMMARY
            echo "| Dev.to | $([ -f data/blog/devto-posted.json ] && echo 'Cross-posted' || echo 'Skipped') |" >> $GITHUB_STEP_SUMMARY
            echo "| Google Indexing | Notified |" >> $GITHUB_STEP_SUMMARY
            echo "| IndexNow | Notified |" >> $GITHUB_STEP_SUMMARY
            echo "| Outreach plan | $([ -d data/outreach ] && echo 'Generated' || echo 'Skipped') |" >> $GITHUB_STEP_SUMMARY
          elif [ -n "$(ls data/blog/posts/*.json 2>/dev/null)" ]; then
            LATEST=$(ls -t data/blog/posts/*.json | head -1)
            SLUG=$(basename "$LATEST" .json)
            ARTICLE_URL="https://subodhkc.com/blog/${SLUG}"

            echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Article | [$SLUG]($ARTICLE_URL) |" >> $GITHUB_STEP_SUMMARY
            echo "| Social content | $([ -f data/social/${SLUG}.md ] && echo 'Generated' || echo 'Missing') |" >> $GITHUB_STEP_SUMMARY
            echo "| Hero image | $([ -f public/blog-images/${SLUG}.png ] && echo 'Generated' || echo 'Missing') |" >> $GITHUB_STEP_SUMMARY
            echo "| LinkedIn | $([ -f data/social/posted.json ] && echo 'Posted' || echo 'Skipped/Failed') |" >> $GITHUB_STEP_SUMMARY
            echo "| Dev.to | $([ -f data/blog/devto-posted.json ] && echo 'Cross-posted' || echo 'Skipped') |" >> $GITHUB_STEP_SUMMARY
            echo "| Google Indexing | Notified |" >> $GITHUB_STEP_SUMMARY
            echo "| IndexNow | Notified |" >> $GITHUB_STEP_SUMMARY
            echo "| Outreach plan | $([ -d data/outreach ] && echo 'Generated' || echo 'Skipped') |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No article was generated. Check logs for errors." >> $GITHUB_STEP_SUMMARY
          fi
