name: CI - Build, Verify & Ping IndexNow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 09:00 UTC - weekly full sitemap ping safety net
    - cron: "0 9 * * 1"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        id: build
        run: npm run build

      - name: Verify sitemap exists
        run: |
          if [ -f "public/sitemap.xml" ]; then
            echo "Static sitemap.xml found"
          else
            echo "Sitemap is dynamically generated by Next.js (app/sitemap.ts) - OK"
          fi

      - name: Verify robots.txt config
        run: |
          if [ -f "app/robots.ts" ]; then
            echo "robots.ts found - dynamic robots.txt configured"
          else
            echo "::warning::app/robots.ts not found"
          fi

      - name: Verify .well-known files
        run: |
          for f in public/.well-known/wikidata-entity.json public/.well-known/ai-plugin.json; do
            if [ -f "$f" ]; then
              echo "Found: $f"
            else
              echo "::error::Missing: $f"
              exit 1
            fi
          done

      - name: Verify LLM files
        run: |
          for f in public/llms.txt public/llms-full.txt public/ai.txt; do
            if [ -f "$f" ]; then
              echo "Found: $f"
            else
              echo "::error::Missing: $f"
              exit 1
            fi
          done

      - name: Verify IndexNow key file
        run: |
          if [ -f "public/subodhkcindexnowkey2026.txt" ]; then
            KEY=$(cat public/subodhkcindexnowkey2026.txt)
            echo "IndexNow key file found: $KEY"
          else
            echo "::error::Missing IndexNow key file"
            exit 1
          fi

      - name: Build summary
        if: always()
        run: |
          echo "## CI Build & Verify Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome == 'success' && 'Passed' || 'Warnings (non-blocking)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sitemap | Verified |" >> $GITHUB_STEP_SUMMARY
          echo "| robots.txt | Verified |" >> $GITHUB_STEP_SUMMARY
          echo "| .well-known files | Verified |" >> $GITHUB_STEP_SUMMARY
          echo "| LLM files | Verified |" >> $GITHUB_STEP_SUMMARY
          echo "| IndexNow key | Verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }} on ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  ping-search-engines:
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    # Search engine notifications are non-blocking — a notification failure
    # must never make a successful build appear broken.
    continue-on-error: true
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for content changes
        id: content-check
        run: |
          # On scheduled runs, always ping (weekly safety net)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_ping=true" >> $GITHUB_OUTPUT
            echo "Scheduled run - pinging all sitemap URLs"
            exit 0
          fi

          # Only ping when blog posts or page files change (not on every push)
          BLOG_CHANGED=$(git diff --name-only HEAD~1 HEAD -- data/blog/posts/ 2>/dev/null | head -1)
          PAGE_CHANGED=$(git diff --name-only HEAD~1 HEAD -- app/ 2>/dev/null | grep -E '(page\.tsx|layout\.tsx|sitemap|robots|not-found)' | head -1)
          PUBLIC_CONTENT=$(git diff --name-only HEAD~1 HEAD -- public/ 2>/dev/null | grep -E '(sitemap|llms|robots|\.well-known)' | head -1)

          if [ -n "$BLOG_CHANGED" ] || [ -n "$PAGE_CHANGED" ] || [ -n "$PUBLIC_CONTENT" ]; then
            echo "should_ping=true" >> $GITHUB_OUTPUT
            echo "Content files changed:"
            [ -n "$BLOG_CHANGED" ] && echo "  - Blog posts: $BLOG_CHANGED"
            [ -n "$PAGE_CHANGED" ] && echo "  - Page files: $PAGE_CHANGED"
            [ -n "$PUBLIC_CONTENT" ] && echo "  - Public content: $PUBLIC_CONTENT"
            echo "Proceeding with search engine pings"
          else
            echo "should_ping=false" >> $GITHUB_OUTPUT
            echo "No content files changed (only code/config changes) - skipping search engine pings"
          fi

      - name: Install Python dependencies for Google API
        if: steps.content-check.outputs.should_ping == 'true'
        run: pip install cryptography

      - name: Wait for Vercel deployment
        if: steps.content-check.outputs.should_ping == 'true'
        run: sleep 60

      - name: Fetch sitemap and extract all URLs
        if: steps.content-check.outputs.should_ping == 'true'
        id: sitemap
        run: |
          SITEMAP=$(curl -s "https://subodhkc.com/sitemap.xml")
          if [ -z "$SITEMAP" ]; then
            echo "::warning::Could not fetch sitemap, using fallback URL list"
            URLS='["https://subodhkc.com","https://subodhkc.com/blog","https://subodhkc.com/feed.xml"]'
          else
            URLS=$(echo "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+' | sort -u | python3 -c "
          import sys, json
          urls = [line.strip() for line in sys.stdin if line.strip()]
          print(json.dumps(urls))
          ")
            echo "Found $(echo "$URLS" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))') URLs in sitemap"
          fi
          echo "urls=$URLS" >> $GITHUB_OUTPUT

      - name: Ping IndexNow with all sitemap URLs
        if: steps.content-check.outputs.should_ping == 'true'
        continue-on-error: true
        run: |
          URLS='${{ steps.sitemap.outputs.urls }}'
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\": \"subodhkc.com\", \"key\": \"subodhkcindexnowkey2026\", \"keyLocation\": \"https://subodhkc.com/subodhkcindexnowkey2026.txt\", \"urlList\": $URLS}")
          echo "IndexNow response: $RESPONSE"
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "202" ]; then
            echo "IndexNow ping successful"
          else
            echo "::warning::IndexNow returned $RESPONSE (non-fatal)"
          fi

      # NOTE: Google Indexing API is NOT used for ordinary site URLs.
      # The Indexing API only supports JobPosting and BroadcastEvent content types.
      # Ordinary pages are discovered via sitemap, IndexNow, and normal crawling.
      # If the site ever publishes JobPosting or BroadcastEvent content, this
      # step can be re-enabled for those specific URLs only.

      - name: Submit sitemap to Google Search Console API
        if: steps.content-check.outputs.should_ping == 'true' && env.GCP_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > /tmp/gcp-service-account.json

          ACCESS_TOKEN=$(python3 -c "
          import json, urllib.request, urllib.parse, base64, time
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          with open('/tmp/gcp-service-account.json') as f:
              key = json.load(f)

          header = {'alg': 'RS256', 'typ': 'JWT'}
          payload = {
              'iss': key['client_email'],
              'scope': 'https://www.googleapis.com/auth/webmasters',
              'aud': 'https://oauth2.googleapis.com/token',
              'exp': int(time.time()) + 3600,
              'iat': int(time.time())
          }

          def b64encode(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          header_b64 = b64encode(json.dumps(header, separators=(',', ':')).encode())
          payload_b64 = b64encode(json.dumps(payload, separators=(',', ':')).encode())

          private_key = serialization.load_pem_private_key(key['private_key'].encode(), password=None)
          signature = private_key.sign(f'{header_b64}.{payload_b64}'.encode(), padding.PKCS1v15(), hashes.SHA256())
          jwt = f'{header_b64}.{payload_b64}.{b64encode(signature)}'

          data = urllib.parse.urlencode({'grant_type': 'urn:ietf:params:oauth:grant-type:jwt-bearer', 'assertion': jwt}).encode()
          req = urllib.request.Request('https://oauth2.googleapis.com/token', data=data)
          resp = urllib.request.urlopen(req)
          print(json.loads(resp.read())['access_token'])
          ")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::Could not get Google access token for sitemap submission"
            exit 0
          fi

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "https://www.googleapis.com/webmasters/v3/sites/sc-domain:subodhkc.com/sitemaps/https://subodhkc.com/sitemap.xml" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "GSC sitemap submission response: $RESPONSE"

      - name: Verify live site is up
        if: steps.content-check.outputs.should_ping == 'true'
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://subodhkc.com")
          echo "Live site status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Site is live"
          else
            echo "::warning::Site returned $STATUS - may still be deploying"
          fi

      - name: Verify IndexNow key is accessible
        if: steps.content-check.outputs.should_ping == 'true'
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://subodhkc.com/subodhkcindexnowkey2026.txt")
          echo "IndexNow key file status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "IndexNow key file is accessible"
          else
            echo "::warning::IndexNow key file returned $STATUS"
          fi

      - name: Ping summary
        if: always()
        run: |
          echo "## Search Engine Ping Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.content-check.outputs.should_ping }}" = "false" ]; then
            echo "Skipped - no content changes detected (only code/config changes)." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Pings only run when blog posts, page files, or public content files change." >> $GITHUB_STEP_SUMMARY
          else
            echo "| Action | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Content change detected | Yes |" >> $GITHUB_STEP_SUMMARY
            echo "| IndexNow ping | ${{ steps.content-check.outputs.should_ping == 'true' && 'Sent' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Google Indexing API | Disabled (not for ordinary pages) |" >> $GITHUB_STEP_SUMMARY
            echo "| GSC sitemap submission | ${{ env.GCP_SERVICE_ACCOUNT_JSON != '' && 'Submitted' || 'Skipped (no credentials)' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Live site check | Completed |" >> $GITHUB_STEP_SUMMARY
            echo "| IndexNow key check | Completed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Trigger: ${{ github.event_name }} on ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          fi
