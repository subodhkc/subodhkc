name: Expand Thin Content

on:
  # Weekly: Sundays at 14:00 UTC (09:00 CST)
  # Runs the thin content expansion pipeline to keep articles above quality thresholds
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:
    inputs:
      slug:
        description: 'Specific slug to expand (leave empty for all thin posts)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (preview without saving)'
        required: false
        type: boolean
        default: false

concurrency:
  group: expand-thin-content
  cancel-in-progress: false

jobs:
  expand-thin-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Expand thin content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret not set"
            exit 1
          fi

          SLUG="${{ github.event.inputs.slug }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          EXTRA_ARGS="--skip-refresh"
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ -n "$SLUG" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --slug=$SLUG"
          fi

          echo "Running: node scripts/expand-thin-content.mjs $EXTRA_ARGS"
          node scripts/expand-thin-content.mjs $EXTRA_ARGS

      - name: Commit and push expanded posts
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain data/blog/posts/)" ]; then
            git add data/blog/posts/
            git commit -m "feat: expand thin content posts with OpenAI"

            MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              git pull --rebase origin main
              if git push; then
                echo "Expanded posts pushed to main (attempt $attempt)"
                break
              else
                echo "Push attempt $attempt failed, retrying..."
                if [ $attempt -eq $MAX_RETRIES ]; then
                  echo "::error::Failed to push after $MAX_RETRIES attempts"
                  exit 1
                fi
                sleep 10
              fi
            done
          else
            echo "No changes to commit"
          fi
