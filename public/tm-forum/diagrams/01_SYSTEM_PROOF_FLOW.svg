  <text x="12" y="288" class="lbl">Source: package 7a0bb5f3 TMF_FIVE_PLANE_ASSURANCE_MATRIX.md + TMF_CONSEQUENCE_PATH.md; ctr-abdf612f (C7 NOT_SATISFIED 9/10); projected tmf-authority-planes. Dashed red = required edge with no bound evidence.</text>
