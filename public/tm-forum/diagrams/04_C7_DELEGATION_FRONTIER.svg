<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
  <marker id="a4d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b00"/></marker>
  <marker id="a4g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0a5c2e"/></marker></defs>
  <style>
    .bx{fill:#fff;stroke:#333;stroke-width:1.2}
    .hdr{font-size:11.5px;font-weight:700;fill:#111}
    .sub{font-size:9.5px;fill:#444}
    .lbl{font-size:9px;fill:#555}
    .gap{fill:#fff;stroke:#b00;stroke-width:1.5;stroke-dasharray:5 3}
    .fix{fill:#fff;stroke:#0a5c2e;stroke-width:1.5}
    .cap{font-size:11px;fill:#b00;font-style:italic;font-weight:600}
    .capg{font-size:11px;fill:#0a5c2e;font-style:italic;font-weight:600}
  </style>
  <text x="12" y="20" class="hdr" font-size="14">C7 delegation frontier — where the proof chain broke, and how remediation closed it</text>

  <!-- ORIGINAL chain -->
  <text x="12" y="44" class="hdr">ORIGINAL — system 4043efee · policy ae6dda36 · run fault-1791167110-5e3126</text>
  <rect x="12"  y="54" width="150" height="56" class="bx"/><text x="24" y="76" class="hdr">CUSTOMER INTENT</text><text x="24" y="92" class="sub">assessed request</text><text x="24" y="104" class="sub">ESTABLISHED</text>
  <rect x="196" y="54" width="150" height="56" class="bx"/><text x="208" y="76" class="hdr">CUSTOMER AGENT</text><text x="208" y="92" class="sub">delegates to IT agent</text><text x="208" y="104" class="sub">OBSERVED</text>
  <rect x="380" y="54" width="150" height="56" class="bx"/><text x="392" y="76" class="hdr">IT AGENT</text><text x="392" y="92" class="sub">tool+model calls observed</text><text x="392" y="104" class="sub">OBSERVED</text>
  <rect x="564" y="54" width="170" height="56" class="gap"/><text x="576" y="76" class="hdr" fill="#b00">IT ↔ NETWORK</text><text x="576" y="90" class="sub" fill="#b00">NEGOTIATION</text><text x="576" y="104" class="sub" fill="#b00">MISSING — no bound evidence</text>
  <rect x="768" y="54" width="200" height="56" class="bx"/><text x="780" y="76" class="hdr">NETWORK AGENT</text><text x="780" y="92" class="sub">→ network consequence</text><text x="780" y="104" class="sub">consequence PARTIAL</text>
  <line x1="162" y1="82" x2="192" y2="82" stroke="#333" stroke-width="1.4" marker-end="url(#a4)"/>
  <line x1="346" y1="82" x2="376" y2="82" stroke="#333" stroke-width="1.4" marker-end="url(#a4)"/>
  <line x1="530" y1="82" x2="560" y2="82" stroke="#b00" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a4d)"/>
  <line x1="734" y1="82" x2="764" y2="82" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a4)"/>

  <!-- capability vs delegation boxes -->
  <rect x="196" y="144" width="334" height="66" class="bx" stroke="#0a5c2e"/>
  <text x="208" y="164" class="hdr" fill="#0a5c2e">CONFIGURED CAPABILITY + PERMISSION</text>
  <text x="208" y="180" class="sub">IT→Network invocation path configured; Cedar policy permits;</text>
  <text x="208" y="194" class="sub">credential evidence established (scoped). POLICY_AUTHORIZED ✓</text>
  <rect x="564" y="144" width="404" height="66" class="gap"/>
  <text x="576" y="164" class="hdr" fill="#b00">OBSERVED DELEGATION = NOT ESTABLISHED (ORIGINAL)</text>
  <text x="576" y="180" class="sub" fill="#b00">No A2A negotiate/delegate event in OBSERVED plane of this run.</text>
  <text x="576" y="194" class="sub" fill="#b00">Capability/permission do not establish observed delegation.</text>

  <text x="196" y="236" class="cap">"Permission is not delegation."</text>
  <text x="196" y="254" class="sub">C7 requires evidence of observed agent-to-agent negotiation, not just that the capability exists.</text>
  <text x="196" y="270" class="sub">Original result: ctr-abdf612f…4c7a = NOT_SATISFIED (9/10; NEGOTIATION missing). UNKNOWN != PASS.</text>

  <!-- REMEDIATION chain -->
  <text x="12" y="310" class="hdr">REMEDIATION — system 44f861cf · policy dcfa6d38 · run fault-1791275895-048d48</text>
  <rect x="196" y="320" width="334" height="66" class="fix"/>
  <text x="208" y="340" class="hdr" fill="#0a5c2e">REAL BEHAVIORAL REMEDIATION</text>
  <text x="208" y="356" class="sub">Network sent the negotiation → IT evaluated + returned the decision</text>
  <text x="208" y="370" class="sub">→ Network received it. Same correlation lineage. No policy rewrite.</text>
  <rect x="564" y="320" width="404" height="66" class="fix"/>
  <text x="576" y="340" class="hdr" fill="#0a5c2e">OBSERVED NEGOTIATION = ESTABLISHED</text>
  <text x="576" y="356" class="sub" fill="#0a5c2e">Negotiation/delegate event present in OBSERVED plane.</text>
  <text x="576" y="370" class="sub" fill="#0a5c2e">10/10 → SATISFIED · ctr-bea968ae…f773 · VALID SYSTEM-SCOPED PASS.</text>
  <line x1="530" y1="353" x2="560" y2="353" stroke="#0a5c2e" stroke-width="1.4" marker-end="url(#a4g)"/>

  <text x="196" y="410" class="capg">Remediation changed real agent behavior — the pass earned a new system/policy/run identity; the original failure is preserved, not rewritten.</text>
  <text x="12" y="426" class="lbl">Source: ctr-abdf612f (original) + ctr-bea968ae (remediation); distinct immutable policy instances — not an exact canonical 4043/ae6d retest.</text>
</svg>
