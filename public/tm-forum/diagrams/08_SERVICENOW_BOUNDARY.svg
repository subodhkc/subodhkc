<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bx{fill:#fff;stroke:#333;stroke-width:1.2}
    .hdr{font-size:11.5px;font-weight:700;fill:#111}
    .sub{font-size:9.5px;fill:#444}
    .lbl{font-size:9px;fill:#555}
    .ok{fill:#0a5c2e}.par{fill:#7a5b00}.unk{fill:#6a6a6a}.ne{fill:#b00}
    .mono{font-family:Consolas,monospace;font-size:9px;fill:#333}
  </style>
  <text x="12" y="20" class="hdr" font-size="14">ServiceNow AI Control Tower boundary — what is proven vs still open</text>

  <!-- left: established -->
  <rect x="12" y="44" width="470" height="180" class="bx" stroke="#0a5c2e"/>
  <text x="24" y="66" class="hdr ok">ESTABLISHED / OBSERVED</text>
  <text x="24" y="88"  class="sub">Connector: <tspan class="ok" font-weight="700">ACTIVE</tspan></text>
  <text x="24" y="104" class="sub">AssumeRole: <tspan class="ok" font-weight="700">OBSERVED</tspan> (5 events)</text>
  <text x="24" y="120" class="sub">AWS account match: <tspan class="ok" font-weight="700">YES</tspan> (352826992186)</text>
  <text x="24" y="136" class="mono">role SgcAictReadOnlyAccessRole · trust ServiceNowAictUser</text>
  <text x="24" y="154" class="sub">Facilitator dependency: <tspan class="ok" font-weight="700">CLOSED</tspan></text>
  <text x="24" y="174" class="sub">SEC-07 (connector/read-only integration): <tspan class="par" font-weight="700">PARTIAL</tspan></text>
  <text x="24" y="196" class="lbl">Connector is on and can read. That is not full governance.</text>

  <!-- right: open -->
  <rect x="498" y="44" width="470" height="180" class="bx" stroke="#b00" stroke-dasharray="5 3"/>
  <text x="510" y="66" class="hdr ne">UNKNOWN / NOT_ESTABLISHED</text>
  <text x="510" y="88"  class="sub">AICT asset materialization: <tspan class="ne" font-weight="700">NOT_ESTABLISHED</tspan></text>
  <text x="510" y="104" class="sub">Cross-platform identity: <tspan class="ne" font-weight="700">NOT_ESTABLISHED</tspan></text>
  <text x="510" y="120" class="sub">Mailbox email delivery: <tspan class="ne" font-weight="700">NOT_ESTABLISHED</tspan> (provider-accepted = ESTABLISHED)</text>
  <text x="510" y="136" class="sub">Inline continuous compliance: <tspan class="ne" font-weight="700">NOT_ESTABLISHED</tspan> (post-run eval)</text>
  <text x="510" y="152" class="sub">Exact canonical 4043/ae6d C7 retest: <tspan class="ne" font-weight="700">NOT_CLAIMED</tspan></text>
  <text x="510" y="174" class="lbl">Human loop + incident path now PROVEN on the real C9 breach.</text>
  <text x="510" y="196" class="sub">SEC-07 stays PARTIAL until AICT asset materialization + identity close.</text>

  <!-- boundary -->
  <line x1="490" y1="44" x2="490" y2="224" stroke="#333" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="12" y="250" class="sub">Boundary rule: connector ACTIVE does not imply governance complete. Partial is reported as partial.</text>
  <text x="12" y="270" class="sub">C9 breach → alert → named human ACK → persisted response → anti-replay → INC0010337 (proven). C16 governance: INC0010319. A resolved incident does not alter the control verdict.</text>
  <text x="12" y="306" class="lbl">Source: package servicenow evidence + projected tmf-servicenow-integration state; INC0010319 / INC0010337 records.</text>
</svg>
