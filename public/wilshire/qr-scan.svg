<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- QR code scan illustration -->
  <!-- Phone outline -->
  <rect x="60" y="30" width="80" height="140" rx="12" fill="#1e3a5f"/>
  <rect x="65" y="40" width="70" height="120" rx="4" fill="#f8fafc"/>
  <!-- QR code on screen -->
  <rect x="75" y="55" width="50" height="50" rx="4" fill="white" stroke="#1e3a5f" stroke-width="2"/>
  <!-- QR pattern (simplified) -->
  <rect x="80" y="60" width="12" height="12" fill="#1e3a5f"/>
  <rect x="108" y="60" width="12" height="12" fill="#1e3a5f"/>
  <rect x="80" y="88" width="12" height="12" fill="#1e3a5f"/>
  <rect x="96" y="76" width="8" height="8" fill="#1e3a5f"/>
  <rect x="108" y="76" width="8" height="8" fill="#1e3a5f"/>
  <rect x="96" y="88" width="8" height="8" fill="#1e3a5f"/>
  <rect x="108" y="88" width="12" height="12" fill="#1e3a5f"/>
  <!-- Scan line -->
  <line x1="75" y1="80" x2="125" y2="80" stroke="#16a34a" stroke-width="2" opacity="0.8"/>
  <!-- Checkmark below QR -->
  <circle cx="100" cy="130" r="15" fill="#16a34a"/>
  <path d="M92 130 L98 136 L108 124" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Status text lines -->
  <rect x="78" y="155" width="44" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="83" y="162" width="34" height="3" rx="1.5" fill="#e2e8f0"/>
  <!-- Home button -->
  <circle cx="100" cy="172" r="4" fill="#cbd5e1"/>
</svg>
